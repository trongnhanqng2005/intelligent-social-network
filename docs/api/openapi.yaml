openapi: 3.1.0
info:
  title: Intelligent Social Network API
  version: 0.1.0
  description: Implemented liveness, readiness, browser authentication, authenticated profile/discovery, Friendship, and Posts & Feed contracts. V5 and focused real Posts behavior are verified on restricted isn-test under separate Owner authorization; this does not establish isn-dev or production readiness.
servers:
  - url: http://127.0.0.1:3000
    description: Local API; the Vite development proxy adds and strips /api.
tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Friendships
  - name: Posts
  - name: Feed
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Dependency-independent liveness check
      responses:
        '200':
          description: API process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Neo4j identity and migration readiness
      responses:
        '200':
          description: Configured database is reachable and current at schema V5. The V5 migration is implemented but has not been applied by this Build.
          content:
            application/json:
              schema:
                type: object
                required: [status, database, schemaVersion]
                properties:
                  status: { const: ready }
                  database: { type: string, example: isn-dev }
                  schemaVersion: { const: 5 }
        '503':
          description: Configured database unavailable, identity mismatch, or schema not ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, database, reason]
                properties:
                  status: { const: not_ready }
                  database: { type: string }
                  reason:
                    type: string
                    enum: [DATABASE_UNAVAILABLE, DATABASE_IDENTITY_MISMATCH, SCHEMA_INSPECTION_FAILED, SCHEMA_UNINITIALIZED, SCHEMA_DRIFT, SCHEMA_VERSION_MISMATCH, SCHEMA_MIGRATION_INCOMPLETE]
                  expectedSchemaVersion: { type: integer }
                  actualSchemaVersion: { type: integer }
  /users/me/profile:
    get:
      tags: [Users]
      operationId: getOwnProfile
      summary: Get the authenticated member's complete profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Own profile, including server-controlled timestamps and concurrency version.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/OwnProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Users]
      operationId: updateOwnProfile
      summary: Update permitted fields on the authenticated member's profile
      description: Target identity is derived from the session. expectedVersion is required; stale writes return PROFILE_CONFLICT and are not committed.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOwnProfile' }
      responses:
        '200':
          description: Updated own profile with incremented version.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/OwnProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/ProfileConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /users:
    get:
      tags: [Users]
      operationId: listMembers
      summary: Browse or search authenticated members
      description: Searches only display names using case- and Vietnamese-accent-insensitive literal substring matching. Excludes the current user and uses deterministic UUID keyset pagination.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
          description: Blank or omitted browses. A nonblank query is 2–80 Unicode code points after normalization.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
          description: Bounded versioned base64url keyset cursor bound to the normalized query; not an authorization token.
      responses:
        '200':
          description: One bounded page of member-visible fields; total member count is not exposed.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDirectoryPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /users/{id}/profile:
    get:
      tags: [Users]
      operationId: getMemberProfile
      summary: Get a member-visible profile
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Member-visible fields only.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/PublicProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /friendships/requests:
    post:
      tags: [Friendships]
      operationId: createFriendshipRequest
      summary: Send a friendship request
      description: The sender is derived from the authenticated session. A reverse pending request is a conflict and is never accepted automatically.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFriendshipRequest' }
      responses:
        '201':
          description: Pending request created.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipMutationResult' }
        '400': { $ref: '#/components/responses/FriendshipBadRequest' }
        '401': { $ref: '#/components/responses/FriendshipUnauthenticated' }
        '403': { $ref: '#/components/responses/FriendshipCsrfFailed' }
        '404':
          description: Recipient does not exist.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Self request, duplicate same-direction request, reverse pending request, or existing friendship.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '413': { $ref: '#/components/responses/FriendshipPayloadTooLarge' }
        '415': { $ref: '#/components/responses/FriendshipUnsupportedMediaType' }
        '422': { $ref: '#/components/responses/FriendshipValidationFailed' }
        '429': { $ref: '#/components/responses/FriendshipRateLimited' }
        '503': { $ref: '#/components/responses/FriendshipServiceUnavailable' }
    get:
      tags: [Friendships]
      operationId: listFriendshipRequests
      summary: List pending requests owned by the caller
      security:
        - sessionCookie: []
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [received, sent] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
          description: Opaque versioned cursor bound to viewer, list and direction.
      responses:
        '200':
          description: Caller-owned pending request page with privacy-safe counterpart profiles.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipRequestPage' }
        '400': { $ref: '#/components/responses/FriendshipBadRequest' }
        '401': { $ref: '#/components/responses/FriendshipUnauthenticated' }
        '422': { $ref: '#/components/responses/FriendshipValidationFailed' }
        '429': { $ref: '#/components/responses/FriendshipRateLimited' }
        '503': { $ref: '#/components/responses/FriendshipServiceUnavailable' }
  /friendships/requests/{requestId}/accept:
    post:
      tags: [Friendships]
      operationId: acceptFriendshipRequest
      summary: Accept a request addressed to the caller
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FriendshipRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyFriendshipAction' }
      responses:
        '200':
          description: Request accepted and canonical friendship created atomically; same-action retries are idempotent.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipMutationResult' }
        '400': { $ref: '#/components/responses/FriendshipBadRequest' }
        '401': { $ref: '#/components/responses/FriendshipUnauthenticated' }
        '403': { $ref: '#/components/responses/FriendshipActionForbidden' }
        '404': { $ref: '#/components/responses/FriendshipRequestNotFound' }
        '409': { $ref: '#/components/responses/FriendshipStateConflict' }
        '413': { $ref: '#/components/responses/FriendshipPayloadTooLarge' }
        '415': { $ref: '#/components/responses/FriendshipUnsupportedMediaType' }
        '422': { $ref: '#/components/responses/FriendshipValidationFailed' }
        '429': { $ref: '#/components/responses/FriendshipRateLimited' }
        '503': { $ref: '#/components/responses/FriendshipServiceUnavailable' }
  /friendships/requests/{requestId}/reject:
    post:
      tags: [Friendships]
      operationId: rejectFriendshipRequest
      summary: Reject a request addressed to the caller
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FriendshipRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyFriendshipAction' }
      responses:
        '200':
          description: Request rejected; same-action retries are idempotent.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipMutationResult' }
        '400': { $ref: '#/components/responses/FriendshipBadRequest' }
        '401': { $ref: '#/components/responses/FriendshipUnauthenticated' }
        '403': { $ref: '#/components/responses/FriendshipActionForbidden' }
        '404': { $ref: '#/components/responses/FriendshipRequestNotFound' }
        '409': { $ref: '#/components/responses/FriendshipStateConflict' }
        '413': { $ref: '#/components/responses/FriendshipPayloadTooLarge' }
        '415': { $ref: '#/components/responses/FriendshipUnsupportedMediaType' }
        '422': { $ref: '#/components/responses/FriendshipValidationFailed' }
        '429': { $ref: '#/components/responses/FriendshipRateLimited' }
        '503': { $ref: '#/components/responses/FriendshipServiceUnavailable' }
  /friendships/requests/{requestId}/cancel:
    post:
      tags: [Friendships]
      operationId: cancelFriendshipRequest
      summary: Cancel a request sent by the caller
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FriendshipRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyFriendshipAction' }
      responses:
        '200':
          description: Request cancelled; same-action retries are idempotent.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipMutationResult' }
        '400': { $ref: '#/components/responses/FriendshipBadRequest' }
        '401': { $ref: '#/components/responses/FriendshipUnauthenticated' }
        '403': { $ref: '#/components/responses/FriendshipActionForbidden' }
        '404': { $ref: '#/components/responses/FriendshipRequestNotFound' }
        '409': { $ref: '#/components/responses/FriendshipStateConflict' }
        '413': { $ref: '#/components/responses/FriendshipPayloadTooLarge' }
        '415': { $ref: '#/components/responses/FriendshipUnsupportedMediaType' }
        '422': { $ref: '#/components/responses/FriendshipValidationFailed' }
        '429': { $ref: '#/components/responses/FriendshipRateLimited' }
        '503': { $ref: '#/components/responses/FriendshipServiceUnavailable' }
  /friendships:
    get:
      tags: [Friendships]
      operationId: listFriendships
      summary: List the caller's accepted friends
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
          description: Opaque versioned cursor bound to viewer and friends list.
      responses:
        '200':
          description: Bounded page of accepted friends with public profile projections.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipPage' }
        '401': { $ref: '#/components/responses/FriendshipUnauthenticated' }
        '422': { $ref: '#/components/responses/FriendshipValidationFailed' }
        '429': { $ref: '#/components/responses/FriendshipRateLimited' }
        '503': { $ref: '#/components/responses/FriendshipServiceUnavailable' }
  /friendships/{friendshipId}:
    delete:
      tags: [Friendships]
      operationId: unfriend
      summary: Remove the exact current friendship
      description: Idempotent. A stale, missing or nonparticipant friendship ID returns 204 and cannot remove a newer relationship.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
        - name: friendshipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Friendship removed or already absent.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: '#/components/responses/FriendshipBadRequest' }
        '401': { $ref: '#/components/responses/FriendshipUnauthenticated' }
        '403': { $ref: '#/components/responses/FriendshipCsrfFailed' }
        '422': { $ref: '#/components/responses/FriendshipValidationFailed' }
        '429': { $ref: '#/components/responses/FriendshipRateLimited' }
        '503': { $ref: '#/components/responses/FriendshipServiceUnavailable' }
  /friendships/status/{memberId}:
    get:
      tags: [Friendships]
      operationId: getFriendshipStatus
      summary: Get the caller's relationship state with one member
      security:
        - sessionCookie: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Caller-relative state; no third-party relationship lookup is available.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [relationship]
                properties:
                  relationship: { $ref: '#/components/schemas/FriendshipRelationship' }
        '401': { $ref: '#/components/responses/FriendshipUnauthenticated' }
        '404': { $ref: '#/components/responses/FriendshipMemberNotFound' }
        '422': { $ref: '#/components/responses/FriendshipValidationFailed' }
        '429': { $ref: '#/components/responses/FriendshipRateLimited' }
        '503': { $ref: '#/components/responses/FriendshipServiceUnavailable' }
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Bootstrap an anonymous or session-bound CSRF token
      responses:
        '200':
          description: Token issued; HttpOnly CSRF cookies are set.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              description: HttpOnly SameSite=Lax CSRF cookies; Secure in production.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an email/password account
      security:
        - csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created; no session is issued.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409':
          description: Duplicate email or caller already authenticated.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate and issue a fixed 24-hour browser session
      security:
        - csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Authenticated; session and rotated CSRF state are set.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie:
              description: HttpOnly SameSite=Lax session cookie; Secure in production.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user, session, csrfToken]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  session: { $ref: '#/components/schemas/Session' }
                  csrfToken: { type: string }
        '401':
          description: Invalid credentials; response is generic.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409':
          description: Caller already authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/session:
    get:
      tags: [Authentication]
      operationId: restoreSession
      summary: Restore the current session using its HttpOnly cookie
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session is active and durably present in Neo4j.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [user, session]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  session: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current durable session and rotate CSRF state
      description: Idempotent after Origin/CSRF validation. Missing, invalid, expired, or revoked sessions return 204; a stale CSRF token returns 403.
      security:
        - csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Active session revoked at most once; cookies cleared/rotated even when no valid session exists.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie:
              description: "Clears session cookie and rotates CSRF context."
              schema: { type: string }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /posts:
    post:
      tags: [Posts]
      operationId: createPost
      summary: Create a plain-text Post as the authenticated member
      description: Author identity is session-derived. Visibility defaults to friends and cannot be changed after creation. Content is NFC-normalized plain text, limited to 2,000 Unicode code points after normalization. A commit transport failure returns WRITE_OUTCOME_UNKNOWN; clients must reconcile before any manual retry.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePost' }
      responses:
        '201':
          description: Post created with server-owned timestamps and version zero.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Service unavailable, inconsistent graph state, or commit outcome could not be confirmed. No automatic write retry is performed.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Posts]
      operationId: getPost
      summary: Read a Post visible to the authenticated member
      description: The owner can always read their Post. Members visibility is available to any authenticated member; friends visibility requires a current accepted canonical friendship. Missing and invisible Posts both return POST_NOT_FOUND.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Explicit caller-visible Post and author projection.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Post is missing, deleted, or invisible to the caller.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Posts]
      operationId: updatePost
      summary: Edit the authenticated owner's Post
      description: Only the owner may edit content. expectedVersion is required; stale concurrent updates return POST_CONFLICT. Visibility is immutable.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePost' }
      responses:
        '200':
          description: Updated Post with incremented version.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: CSRF/Origin failure or a visible Post mutation by a non-owner (POST_ACTION_FORBIDDEN).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404': { description: Post is missing, deleted, or invisible; response uses POST_NOT_FOUND. }
        '409': { description: expectedVersion is stale; response uses POST_CONFLICT. }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Posts]
      operationId: deletePost
      summary: Permanently delete the authenticated owner's Post
      description: Requires expectedVersion as a query parameter and an empty request body. Only the owner may delete; a visible non-owner receives POST_ACTION_FORBIDDEN, while missing/invisible Posts return POST_NOT_FOUND. Deletion is permanent.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
      responses:
        '204':
          description: Post and its verified sole AUTHORED edge permanently deleted.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: CSRF/Origin failure or visible non-owner mutation; response is no-store. }
        '404': { description: Post is missing, deleted, or invisible; response uses POST_NOT_FOUND. }
        '409': { description: expectedVersion is stale; response uses POST_CONFLICT. }
        '422': { description: Invalid version or a request body was supplied; response is no-store. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /users/{memberId}/posts:
    get:
      tags: [Posts]
      operationId: listMemberPosts
      summary: List Posts visible on one member's profile
      description: Only authenticated members may read. Owner/current accepted friends may see friends Posts; any authenticated member may see members Posts. Visibility is filtered before chronological keyset pagination.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PostsLimit'
        - $ref: '#/components/parameters/PostsCursor'
      responses:
        '200':
          description: Bounded caller-visible page, ordered by createdAt DESC then id DESC.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostsPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Member does not exist; response is no-store. }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /feed:
    get:
      tags: [Feed]
      operationId: getFeed
      summary: Get the authenticated member's chronological Home Feed
      description: Includes the viewer and currently accepted canonical friends only. Both visibility levels are shown for these authors; friendship-only Posts are included retroactively after acceptance and excluded after unfriend. Visibility is enforced in Neo4j before bounded keyset pagination. Ordering is createdAt DESC, id DESC; OFFSET is not used.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/PostsLimit'
        - $ref: '#/components/parameters/PostsCursor'
      responses:
        '200':
          description: Bounded chronological Home Feed page.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostsPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Signed double-submit token returned by GET /auth/csrf.
    sessionCookie:
      type: apiKey
      in: cookie
      name: isn_session
      description: HttpOnly signed session cookie; production name is __Host-isn_session.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
      description: Must exactly match configured AUTH_WEB_ORIGIN.
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    PostsLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    PostsCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
      description: Versioned base64url keyset cursor bound to the scope, authenticated viewer and, for profile Posts, profile member. It is not an authorization token.
    FriendshipRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    NoStore:
      description: Response must not be stored by caches.
      schema: { type: string, const: no-store }
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 15
          maxLength: 512
          description: Service enforces 15–128 Unicode code points and at most 512 UTF-8 bytes.
    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
    Session:
      type: object
      additionalProperties: false
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time }
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, bio, location]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 280 }
        location: { type: [string, 'null'], maxLength: 80 }
    OwnProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, bio, location, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 280 }
        location: { type: [string, 'null'], maxLength: 80 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
    UpdateOwnProfile:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 280 }
        location: { type: [string, 'null'], maxLength: 80 }
        expectedVersion: { type: integer, minimum: 0, maximum: 9007199254740991 }
      description: At least one editable property is required. Omitted fields remain unchanged; null clears bio/location. Values are normalized and measured by Unicode code points by the API.
    MemberDirectoryPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PublicProfile' }
        pagination:
          type: object
          additionalProperties: false
          required: [limit, hasMore, nextCursor]
          properties:
            limit: { type: integer, minimum: 1, maximum: 50 }
            hasMore: { type: boolean }
            nextCursor: { type: [string, 'null'], maxLength: 512 }
    PostVisibility:
      type: string
      enum: [members, friends]
    PostAuthor:
      type: object
      additionalProperties: false
      required: [id, displayName, bio, location]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        bio: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
    PostPermissions:
      type: object
      additionalProperties: false
      required: [canEdit, canDelete]
      properties:
        canEdit: { type: boolean, description: UI hint only; server always reauthorizes mutations. }
        canDelete: { type: boolean, description: UI hint only; server always reauthorizes mutations. }
    Post:
      type: object
      additionalProperties: false
      required: [id, content, visibility, createdAt, updatedAt, version, author, permissions]
      properties:
        id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 2000, description: NFC-normalized plain text; maximum is Unicode code points, not UTF-16 units. }
        visibility: { $ref: '#/components/schemas/PostVisibility' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0, maximum: 9007199254740991 }
        author: { $ref: '#/components/schemas/PostAuthor' }
        permissions: { $ref: '#/components/schemas/PostPermissions' }
    CreatePost:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, description: "NFC-normalized plain text; the 2,000-code-point maximum applies after normalization." }
        visibility:
          allOf: [{ $ref: '#/components/schemas/PostVisibility' }]
          default: friends
      description: Content is normalized to NFC and LF newlines, outer whitespace is trimmed, and a normalized 2,000-code-point limit applies. Markup is stored/rendered as literal plain text; media is not accepted.
    UpdatePost:
      type: object
      additionalProperties: false
      required: [content, expectedVersion]
      properties:
        content: { type: string, minLength: 1, description: "NFC-normalized plain text; the 2,000-code-point maximum applies after normalization." }
        expectedVersion: { type: integer, minimum: 0, maximum: 9007199254740991 }
      description: Visibility is immutable. A stale expectedVersion returns 409 POST_CONFLICT.
    PostsPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Post' }
        pagination:
          type: object
          additionalProperties: false
          required: [limit, hasMore, nextCursor]
          properties:
            limit: { type: integer, minimum: 1, maximum: 50 }
            hasMore: { type: boolean }
            nextCursor: { type: [string, 'null'], maxLength: 512 }
    CreateFriendshipRequest:
      type: object
      additionalProperties: false
      required: [recipientId]
      properties:
        recipientId: { type: string, format: uuid }
    EmptyFriendshipAction:
      type: object
      additionalProperties: false
    FriendshipRequest:
      type: object
      additionalProperties: false
      required: [id, senderId, recipientId, status, createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    FriendshipRelationship:
      type: object
      additionalProperties: false
      required: [memberId, state, requestId, friendshipId, friendsSince]
      properties:
        memberId: { type: string, format: uuid }
        state: { type: string, enum: [self, none, outgoing_pending, incoming_pending, friends] }
        requestId: { type: [string, 'null'], format: uuid }
        friendshipId: { type: [string, 'null'], format: uuid }
        friendsSince: { type: [string, 'null'], format: date-time }
    FriendshipMember:
      type: object
      additionalProperties: false
      required: [id, displayName, bio, location]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 280 }
        location: { type: [string, 'null'], maxLength: 80 }
    FriendshipMutationResult:
      type: object
      additionalProperties: false
      required: [request, relationship]
      properties:
        request: { $ref: '#/components/schemas/FriendshipRequest' }
        relationship: { $ref: '#/components/schemas/FriendshipRelationship' }
    FriendshipRequestListItem:
      type: object
      additionalProperties: false
      required: [request, member]
      properties:
        request: { $ref: '#/components/schemas/FriendshipRequest' }
        member: { $ref: '#/components/schemas/FriendshipMember' }
    FriendshipListItem:
      type: object
      additionalProperties: false
      required: [friendshipId, friendsSince, member]
      properties:
        friendshipId: { type: string, format: uuid }
        friendsSince: { type: string, format: date-time }
        member: { $ref: '#/components/schemas/FriendshipMember' }
    FriendshipPagination:
      type: object
      additionalProperties: false
      required: [limit, hasMore, nextCursor]
      properties:
        limit: { type: integer, minimum: 1, maximum: 50 }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'], maxLength: 512 }
    FriendshipRequestPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FriendshipRequestListItem' }
        pagination: { $ref: '#/components/schemas/FriendshipPagination' }
    FriendshipPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FriendshipListItem' }
        pagination: { $ref: '#/components/schemas/FriendshipPagination' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ApiError' }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    FriendshipBadRequest:
      description: Malformed JSON request body.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipUnauthenticated:
      description: No valid current session.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipCsrfFailed:
      description: Origin, cross-site, or CSRF validation failed.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipValidationFailed:
      description: Request fields failed validation.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipRateLimited:
      description: In-memory per-process limit exceeded; Retry-After is seconds.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipServiceUnavailable:
      description: Required service is unavailable.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipPayloadTooLarge:
      description: Request body exceeds the 8 KiB JSON limit.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipUnsupportedMediaType:
      description: Friendship POST actions require application/json.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    CsrfFailed:
      description: Origin, cross-site, or CSRF validation failed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthenticated:
      description: No valid current session.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationFailed:
      description: Request fields failed validation.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ProfileNotFound:
      description: No member exists for the supplied UUID.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipRequestNotFound:
      description: Request is missing, stale, or not visible to the caller.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipMemberNotFound:
      description: Target member does not exist.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipActionForbidden:
      description: Origin/CSRF validation failed or the participant attempted an action not allowed by their role.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    FriendshipStateConflict:
      description: Request lifecycle has already changed or the requested transition is not available.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ProfileConflict:
      description: Profile version changed since the client read it; no update was committed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: In-memory per-process limit exceeded; Retry-After is seconds.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Required service is unavailable.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PayloadTooLarge:
      description: Request body exceeds the 8 KiB JSON limit.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnsupportedMediaType:
      description: Authentication mutations and profile updates require application/json.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
