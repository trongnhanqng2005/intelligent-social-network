openapi: 3.1.0
info:
  title: Intelligent Social Network API
  version: 0.1.0
  description: Implemented liveness, readiness, browser authentication, and authenticated user profile/discovery contracts.
servers:
  - url: http://127.0.0.1:3000
    description: Local API; the Vite development proxy adds and strips /api.
tags:
  - name: Health
  - name: Authentication
  - name: Users
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Dependency-independent liveness check
      responses:
        '200':
          description: API process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Neo4j identity and migration readiness
      responses:
        '200':
          description: Configured database is reachable and current at schema V3.
          content:
            application/json:
              schema:
                type: object
                required: [status, database, schemaVersion]
                properties:
                  status: { const: ready }
                  database: { type: string, example: isn-dev }
                  schemaVersion: { const: 3 }
        '503':
          description: Configured database unavailable, identity mismatch, or schema not ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, database, reason]
                properties:
                  status: { const: not_ready }
                  database: { type: string }
                  reason:
                    type: string
                    enum: [DATABASE_UNAVAILABLE, DATABASE_IDENTITY_MISMATCH, SCHEMA_INSPECTION_FAILED, SCHEMA_UNINITIALIZED, SCHEMA_DRIFT, SCHEMA_VERSION_MISMATCH, SCHEMA_MIGRATION_INCOMPLETE]
                  expectedSchemaVersion: { type: integer }
                  actualSchemaVersion: { type: integer }
  /users/me/profile:
    get:
      tags: [Users]
      operationId: getOwnProfile
      summary: Get the authenticated member's complete profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Own profile, including server-controlled timestamps and concurrency version.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/OwnProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Users]
      operationId: updateOwnProfile
      summary: Update permitted fields on the authenticated member's profile
      description: Target identity is derived from the session. expectedVersion is required; stale writes return PROFILE_CONFLICT and are not committed.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOwnProfile' }
      responses:
        '200':
          description: Updated own profile with incremented version.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/OwnProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/ProfileConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /users:
    get:
      tags: [Users]
      operationId: listMembers
      summary: Browse or search authenticated members
      description: Searches only display names using case- and Vietnamese-accent-insensitive literal substring matching. Excludes the current user and uses deterministic UUID keyset pagination.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
          description: Blank or omitted browses. A nonblank query is 2–80 Unicode code points after normalization.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
          description: Bounded versioned base64url keyset cursor bound to the normalized query; not an authorization token.
      responses:
        '200':
          description: One bounded page of member-visible fields; total member count is not exposed.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDirectoryPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /users/{id}/profile:
    get:
      tags: [Users]
      operationId: getMemberProfile
      summary: Get a member-visible profile
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Member-visible fields only.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/PublicProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ProfileNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Bootstrap an anonymous or session-bound CSRF token
      responses:
        '200':
          description: Token issued; HttpOnly CSRF cookies are set.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              description: HttpOnly SameSite=Lax CSRF cookies; Secure in production.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an email/password account
      security:
        - csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created; no session is issued.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409':
          description: Duplicate email or caller already authenticated.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate and issue a fixed 24-hour browser session
      security:
        - csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Authenticated; session and rotated CSRF state are set.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie:
              description: HttpOnly SameSite=Lax session cookie; Secure in production.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user, session, csrfToken]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  session: { $ref: '#/components/schemas/Session' }
                  csrfToken: { type: string }
        '401':
          description: Invalid credentials; response is generic.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409':
          description: Caller already authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/session:
    get:
      tags: [Authentication]
      operationId: restoreSession
      summary: Restore the current session using its HttpOnly cookie
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session is active and durably present in Neo4j.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [user, session]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  session: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current durable session and rotate CSRF state
      description: Idempotent after Origin/CSRF validation. Missing, invalid, expired, or revoked sessions return 204; a stale CSRF token returns 403.
      security:
        - csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Active session revoked at most once; cookies cleared/rotated even when no valid session exists.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie:
              description: "Clears session cookie and rotates CSRF context."
              schema: { type: string }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Signed double-submit token returned by GET /auth/csrf.
    sessionCookie:
      type: apiKey
      in: cookie
      name: isn_session
      description: HttpOnly signed session cookie; production name is __Host-isn_session.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
      description: Must exactly match configured AUTH_WEB_ORIGIN.
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 15
          maxLength: 512
          description: Service enforces 15–128 Unicode code points and at most 512 UTF-8 bytes.
    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
    Session:
      type: object
      additionalProperties: false
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time }
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, bio, location]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 280 }
        location: { type: [string, 'null'], maxLength: 80 }
    OwnProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, bio, location, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 280 }
        location: { type: [string, 'null'], maxLength: 80 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
    UpdateOwnProfile:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 280 }
        location: { type: [string, 'null'], maxLength: 80 }
        expectedVersion: { type: integer, minimum: 0, maximum: 9007199254740991 }
      description: At least one editable property is required. Omitted fields remain unchanged; null clears bio/location. Values are normalized and measured by Unicode code points by the API.
    MemberDirectoryPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PublicProfile' }
        pagination:
          type: object
          additionalProperties: false
          required: [limit, hasMore, nextCursor]
          properties:
            limit: { type: integer, minimum: 1, maximum: 50 }
            hasMore: { type: boolean }
            nextCursor: { type: [string, 'null'], maxLength: 512 }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ApiError' }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    CsrfFailed:
      description: Origin, cross-site, or CSRF validation failed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthenticated:
      description: No valid current session.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationFailed:
      description: Request fields failed validation.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ProfileNotFound:
      description: No member exists for the supplied UUID.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ProfileConflict:
      description: Profile version changed since the client read it; no update was committed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: In-memory per-process limit exceeded; Retry-After is seconds.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Required service is unavailable.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PayloadTooLarge:
      description: Request body exceeds the 8 KiB JSON limit.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnsupportedMediaType:
      description: Authentication mutations and profile updates require application/json.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
